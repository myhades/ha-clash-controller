name: Tests

on:
  pull_request:
    branches: [main]
  workflow_call:
    inputs:
      full:
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  integration:
    name: Integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: tests/requirements.txt
      - name: Install test dependencies
        run: pip install -r tests/requirements.txt
      - name: Run API and Home Assistant contracts
        run: python tests/run.py integration

  core-compatibility:
    name: Core compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: tests/requirements.txt
      - uses: actions/cache@v4
        with:
          path: .cache/core-compatibility
          key: cores-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tests/core_compatibility/assets.json') }}
      - name: Install test dependencies
        run: pip install -r tests/requirements.txt
      - name: Run all pinned cores
        env:
          FULL_VALIDATION: ${{ inputs.full }}
        run: |
          if [ "$FULL_VALIDATION" = "true" ]; then
            python tests/run.py system --full
          else
            python tests/run.py system
          fi
